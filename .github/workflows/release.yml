name: Release
# Pushing a tag such as v0.3.0 builds the release tarballs and publishes
# them with SHA256SUMS. The panel's updater (WHM > Updates) installs a
# release only when its tarball matches SHA256SUMS.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - name: Build tarballs
        run: make build VERSION="${GITHUB_REF_NAME#v}"
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes)
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${args[@]}" --title "BreeferCP ${GITHUB_REF_NAME#v}"
