# BreeferCP: /etc/ssh/sshd_config.d/50-breefercp.conf
# Accounts with "SFTP only" shell access are in this group. They can transfer
# files but never get an interactive shell or port forwarding.
Match Group breefer-sftp
    ForceCommand internal-sftp -d /home/%u
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
