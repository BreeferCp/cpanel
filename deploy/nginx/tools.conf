# BreeferCP web tools: phpMyAdmin and Roundcube on port 8443.
# Installed as /etc/nginx/conf.d/10-breefercp-tools.conf by install.sh.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/breefercp/panel.crt;
    ssl_certificate_key /etc/breefercp/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    client_max_body_size 128m;

    location = / { return 302 /webmail/; }

    location /phpmyadmin/ {
        alias /usr/share/phpmyadmin/;
        index index.php;
        location ~ ^/phpmyadmin/(libraries|setup|templates|vendor)/ { deny all; }
        location ~ ^/phpmyadmin/(.+\.php)$ {
            alias /usr/share/phpmyadmin/$1;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/share/phpmyadmin/$1;
            fastcgi_pass unix:/run/php/breefer-tools.sock;
        }
    }

    location /webmail/ {
        alias /var/lib/roundcube/public_html/;
        index index.php;
        location ~ ^/webmail/(.+\.php)$ {
            alias /var/lib/roundcube/public_html/$1;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/lib/roundcube/public_html/$1;
            fastcgi_pass unix:/run/php/breefer-tools.sock;
        }
    }
}
