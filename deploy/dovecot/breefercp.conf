# BreeferCP: /etc/dovecot/conf.d/99-breefercp.conf
protocols = imap pop3 lmtp sieve
mail_location = maildir:~
mail_home = /home/%Ln
ssl = required
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql-breefercp.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql-breefercp.conf.ext
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

plugin {
  quota = maildir:User quota
  # The panel writes each mailbox's spam filter and autoresponder here.
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_extensions = +vacation-seconds
}
protocol imap { mail_plugins = $mail_plugins quota imap_quota }
protocol lmtp {
  mail_plugins = $mail_plugins quota sieve
  postmaster_address = postmaster@localhost
}
namespace inbox {
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}
